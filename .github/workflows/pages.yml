name: Deploy staging to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:manual
      - run: npm run typecheck

      - name: Build GitHub Pages staging
        run: npm run build
        env:
          VITE_BASE_PATH: /matcha-high-yagi-garden/

      - name: Preserve staging build
        run: mv dist dist-pages

      - name: Build Vercel root mirror
        run: npm run build
        env:
          VITE_BASE_PATH: /

      - name: Add Vercel mirror to Pages artifact
        run: |
          mkdir -p dist-pages/vercel-build
          cp -a dist/. dist-pages/vercel-build/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
